# Minimal-Userland-SDK für extern geladene Caprock-EL0-Programme (ext-26).
# Syscall-Stubs (SVC-ABI) + Panik-Handler. Gemeinsame, NICHT gegenseitige Abhängigkeit der
# Programme. Spiegelt die ABI aus crates/caprock-abi (bewusst dupliziert: externe Programme
# sollen NICHT vom Kernel-Workspace abhängen).
[package]
name = "libcaprock"
version.workspace = true
edition.workspace = true
# **GRENZ-CRATE: permissiv, und das ist tragend** (docs/grenze.md). Jede PD linkt das hier --
# stuende es unter AGPL, waere jedes Programm mit AGPL-Code gelinkt und die ABI-Ausnahme
# gegenstandslos. Dieselbe Grenze, fuer die Linux die UAPI-Header-Ausnahme hat.
license = "MIT OR Apache-2.0"

