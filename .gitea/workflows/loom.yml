# !!! DIESE DATEI LAEUFT NIRGENDS (Stand 2026-08-03). !!!
# Der Server ist GitLab und liest .gitea/workflows/ nicht; der laufende Stand steht in
# `.gitlab-ci.yml`. Begruendung und Messung im Kopf von .gitea/workflows/verus.yml.
#
# Caprock — Concurrency-Verifikation (Loom) als CI-Gate.
#
# Ziel: jeder Push/PR exploriert die Sync-Primitive (RwSpinLock + Ticket-SpinLock) erneut ueber ALLE
# Thread-Interleavings. Bricht eine spaetere Aenderung den gegenseitigen Ausschluss / fuehrt ein
# Lost-Update oder einen Reader-Zaehler-Unterlauf ein, schlaegt die CI fehl.
#
# Gitea Actions (GitHub-Actions-kompatibel). Laeuft tools/loom-verify.sh (eigenstaendige Crate-Kopie
# nach $TMPDIR -> kein build-std-Zwang; loom braucht Host-std + crates.io).

name: loom-verification
on: [push, pull_request]

jobs:
  loom:
    name: Loom — Concurrency der Sync-Primitive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain (rustup, stable) installieren
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: crates.io-Cache (loom)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: loom-v0.7-${{ runner.os }}

      - name: Loom-Modelle ausfuehren (alle Interleavings)
        run: bash tools/loom-verify.sh
