# Management-Autoritaet (PDCTL/LOAD/KILL -> BADCAP) und kann NICHTS jenseits seines eigenen
# Partner-Kanals erreichen. Cap-Confusion + Eskalation, alle abgewiesen (Self-Judging).
[package]
name = "aggressor-h"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aggressor-h"
path = "src/main.rs"

[dependencies]
libsel4lake = { path = "../../../../programs/libsel4lake" }
