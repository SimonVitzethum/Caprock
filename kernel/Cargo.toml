# The SEL4Lake kernel image.
#
# Phase 0: bootable skeleton. By design the kernel image will only ever contain
# the microkernel, capability system, scheduler, IPC and the Microkit runtime —
# drivers and services live in userland (see docs/adr/0006-hot-reload-architecture.md).

[package]
name = "sel4lake-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "sel4lake-kernel"
path = "src/main.rs"

[features]
# Optionale In-Kernel-Fuzzer (Entwicklungs-/Verifikationswerkzeuge, ADR 0013). NICHT in `default`:
# der Release-Build enthaelt keinerlei Fuzzer-Code. Mit `--features kernel-fuzz` werden die vier
# Fuzzer (fuzz/ipcfuzz/hwfuzz/loaderfuzz) aus `threads/fuzz.rs` einkompiliert. Die Audits bleiben
# IMMER im Kernel (feature-unabhaengig).
# `selftest` — die gesamte Pruefinfrastruktur (Selbsttests, Demo-/Testthreads, DMA-/DMAR-Tests,
# Farbtest, `system::testsupport`). Rund ein Viertel des Kernels ist Testcode, und er wurde bis
# hierher bei JEDEM Start mitkompiliert und ausgefuehrt.
#
# **Vorerst in `default`.** Das ist Absicht und kein Zoegern: schaltet man heute alles ab, bleibt
# `configure() -> idle`. Der Kernel hat derzeit keinen Nicht-Test-Zweck -- auf x86 gibt es kein
# Boot-Archiv, und auf aarch64 ruft den Loader niemand ausser `threads/mod.rs`. Das Gating waere
# also kein schlankerer Kernel, sondern ein leerer. Der ehrliche Ersatz ist der seL4-Weg: ein
# Startprogramm aus dem Archiv laden und ihm die Wurzel-Caps uebergeben (todo F2).
#
# Bauen ohne: `cargo build --release --no-default-features --target ...`
# **Beide Konfigurationen gehoeren in die Testskripte.** Ein `--no-default-features`-Build, den
# niemand baut, verrottet still -- und genau diese Fehlerform hat hier schon mehrfach zugeschlagen
# (leere Event-Queue, nie ausgefuehrter x86-Testpfad, DMAR-Ausschlusspfad).
default = ["selftest"]
selftest = []
kernel-fuzz = []
# Continuous-Soak-Treiber (Burn-in #2): nach dem Selbsttest faehrt der Idle-Manager statt
# `system_off` eine Endlos-Epochenschleife (Dauerbetrieb EINER Instanz). NUR Harness/Testcode; der
# Kernel-Kern bleibt byte-identisch zum Release. Mit `soak,kernel-fuzz` kombinierbar.
soak = []

# Der Kernel-Kern + die aarch64-HAL: derzeit aarch64-spezifisch. Auf dem x86_64-Branch (Stufe 0:
# nur Boot+Serial) werden sie NICHT kompiliert; Stufe fuer Stufe werden die arch-agnostischen Crates
# ext-31: Alle Subsystem-Crates bauen jetzt fuer BEIDE Architekturen (die HAL waehlt ihre
# Implementierung per cfg(target_arch), s. sel4lake-hal). Die frueher aarch64-only Sektion
# entfaellt damit.
[dependencies]
sel4lake-hal = { path = "../crates/sel4lake-hal" }
sel4lake-sync = { path = "../crates/sel4lake-sync" }
sel4lake-slab = { path = "../crates/sel4lake-slab" }
sel4lake-mem = { path = "../crates/sel4lake-mem" }
sel4lake-region = { path = "../crates/sel4lake-region" }
sel4lake-loader = { path = "../crates/sel4lake-loader" }
sel4lake-trust = { path = "../crates/sel4lake-trust" }
sel4lake-cap = { path = "../crates/sel4lake-cap" }
sel4lake-sched = { path = "../crates/sel4lake-sched" }
sel4lake-ipc = { path = "../crates/sel4lake-ipc" }
sel4lake-abi = { path = "../crates/sel4lake-abi" }
sel4lake-microkit = { path = "../crates/sel4lake-microkit" }

# Device-Tree gibt es nur auf der ARM-Plattform (x86 nutzt Multiboot/ACPI).
[target.'cfg(target_arch = "aarch64")'.dependencies]
sel4lake-dtb = { path = "../crates/sel4lake-dtb" }
