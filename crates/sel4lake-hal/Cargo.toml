# MMU-/Interrupt-Init, Low-Level-Routinen) — jeweils begründet und gekapselt.
[package]
name = "sel4lake-hal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
