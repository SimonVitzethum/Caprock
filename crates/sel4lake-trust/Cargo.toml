# Krypto-Primitive fuer die TrustedSAS-Zertifikatspruefung (ext-28, ADR 0014).
# Etablierte Krypto (keine Eigenentwicklung): Ed25519-Verifikation + SHA-256. no_std + no-alloc;
# NUR kernel-seitig genutzt (Verifier) -> die TrustedSAS-Programm-Trust-Basis bleibt unberuehrt.
# KEIN Signieren (das macht host-seitig das Build-Tool) -> kein RNG noetig.
[package]
name = "sel4lake-trust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ed25519-dalek = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false }
