# Build configuration for the Caprock kernel.
#
# We cross-compile to a custom bare-metal aarch64 target and build `core`,
# `alloc` and `compiler_builtins` from source (no precompiled std exists for a
# freestanding target). Always invoke from the workspace root so the relative
# linker-script path below resolves.

[build]
target = "targets/aarch64-caprock.json"
target-dir = "build/target"

[unstable]
# Recent nightlies gate custom `.json` target specs behind this flag.
json-target-spec = true
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

# **Das Linkerskript steht NICHT hier, sondern in `kernel/build.rs`.**
#
# Cargo mischt `.cargo/config.toml` aus JEDEM Vorfahrenverzeichnis und **haengt Array-Werte
# aneinander**. Ein Arbeitsbaum innerhalb eines anderen Checkouts (`<repo>/.claude/worktrees/<id>`)
# erbt diese Datei deshalb ein zweites Mal, und `-Tkernel/linker.ld` steht doppelt auf der
# Linkerzeile -- `lld` wertet den `SECTIONS`-Block zweimal aus, alle Linkersymbole tragen danach
# die Werte des zweiten Durchlaufs, und der Bau laeuft durch. Am 2026-08-10 gemessen; die
# Begruendung samt Waechter steht in `kernel/build.rs`.
#
# `cargo:rustc-link-arg` in `build.rs` entsteht **je Crate genau einmal** und durchlaeuft diese
# Mischung nicht. Nebenertrag: der Pfad ist dort absolut und setzt nicht mehr voraus, dass `cargo`
# aus dem Wurzelverzeichnis laeuft.

[target.aarch64-caprock]
rustflags = []

# x86_64-Port (Branch arch/x86_64): eingebauter Bare-Metal-Target x86_64-unknown-none
# (soft-float, kein SSE, static). Eigenes Linker-Skript (Multiboot1 @ 1 MiB). Per
# `--target x86_64-unknown-none` gewaehlt (s. build-x86.sh / test-qemu-x86.sh).
# Das Linkerskript steht auch hier nicht -- s. o. und `kernel/build.rs`. `relocation-model` bleibt:
# es doppelt zu setzen ist folgenlos (derselbe Wert), und ein `build.rs` kann es nicht setzen.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
]
# NOTE on FP/NEON: we keep them enabled (the aarch64 ABI ties `fp-armv8` to
# `neon`; disabling them is being phased out by rustc). The kernel itself avoids
# floating point, and FP/SIMD register state will be saved on context switch
# only when a thread uses it (lazy FP) — handled in the context-switch phase.
# `strict-align` is set in the target spec (targets/aarch64-caprock.json):
# with the MMU off, all accesses are Device-typed and must be aligned.
