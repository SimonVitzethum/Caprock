# SEL4Lake — CI-Gates auf dem Server, der sie auch liest.
#
# **Warum diese Datei existiert.** Bis zum 2026-08-03 lagen alle drei Gates (Kani, Loom, Verus) in
# `.gitea/workflows/`. Der Server unter git.simonsmp.jocraft.cc:8443 ist aber **GitLab**
# (`x-gitlab-meta`-Kopfzeile, Merge-Request-URLs statt Pull-Requests), und GitLab liest
# `.gitea/workflows/` nicht. Gemessen ueber die Pipelines-API: **zwei** Pipelines insgesamt, beide
# vom 2026-05-23, beide auf `main`, mit den Auto-DevOps-Vorgabejobs (`semgrep-sast`,
# `container_scanning`, `code_quality`, `build`, `test`) — also GitLabs Standardvorlage, nicht
# unseren Gates. Seither: keine.
#
# Das erklaert einen Befund vom selben Tag vollstaendig. `tools/verus-verify.sh` war seit dem
# 2026-06-27 rot (`cap_space.rs`: 9 verified, 1 errors), waehrend der Commit dazu
# "delete (Leaf) gegen die VOLLE cap_inv bewiesen" hiess und das Gate am selben Tag angelegt wurde.
# Die naheliegende Erklaerung war "gelaufen, aber niemand hat das Ergebnis gelesen". Die richtige
# ist schlimmer: es ist **nie gelaufen**. Ein Gate, das auf keinem Server steht, ist keine
# schwaechere Zusicherung — es ist gar keine.
#
# Dieselbe Form wie die Beschriftung "Kani — Tier-1-Beweise (Loader-Parser)" fuer einen Job, der in
# Wahrheit alle vier Ziele fuhr, und wie `CLAUDE.md` in `.git/info/exclude`: eine Sache sieht
# vorhanden aus, weil ihr Name vorhanden ist.
#
# **Offen und hier NICHT beantwortet:** ob ein Runner registriert ist. Wenn keiner da ist,
# entstehen Pipelines und ihre Jobs bleiben `pending` — das ist von aussen unterscheidbar von
# "keine Pipeline" (kein Konfigfund) und von "gruen". Genau diese drei Faelle muss man nach dem
# ersten Push auseinanderhalten, bevor irgendwo "die CI prueft das" geschrieben wird.

stages: [gate]

# GitLab kann nur Pfade INNERHALB von $CI_PROJECT_DIR cachen — anders als actions/cache. Deshalb
# wandern cargo/rustup/kani/verus in den Projektbaum.
variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
  KANI_HOME: "$CI_PROJECT_DIR/.kani"
  VERUS_HOME: "$CI_PROJECT_DIR/.verus"
  GIT_DEPTH: "20"

default:
  image: rust:1-bookworm
  before_script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup --version && cargo --version

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------------------------
# Tier 2 — Verus. Der Pin nennt den Beweiser, aus dem die Zahlen stammen; bis 2026-08-03 stand im
# Gitea-Workflow 0.2026.06.20.911e4e7, waehrend lokal 0.2026.07.27.31579f0 lief. Zwei Beweiser fuer
# dieselbe Aussage, und keine Stelle, an der das aufgefallen waere.
# ---------------------------------------------------------------------------------------------
verus:
  stage: gate
  variables:
    VERUS_RELEASE: "0.2026.07.27.31579f0"
    VERUS_TOOLCHAIN: "1.97.1"
  cache:
    key: "verus-$VERUS_RELEASE"
    paths: [.verus/, .cargo/, .rustup/]
  script:
    - apt-get update -qq && apt-get install -y -qq curl unzip python3 >/dev/null
    - rustup toolchain install "$VERUS_TOOLCHAIN" --profile minimal
    - |
      if [ ! -x "$VERUS_HOME/verus" ]; then
        url="https://github.com/verus-lang/verus/releases/download/release/${VERUS_RELEASE}/verus-${VERUS_RELEASE}-x86-linux.zip"
        curl -fsSL "$url" -o /tmp/verus.zip
        rm -rf /tmp/vx && unzip -q /tmp/verus.zip -d /tmp/vx
        mkdir -p "$VERUS_HOME" && cp -r /tmp/vx/*/. "$VERUS_HOME/"
      fi
      "$VERUS_HOME/verus" --version
    # **Erst nachweisen, dass dieses Gate fehlschlagen KANN.** Der Selbsttest schiebt eine
    # nachweislich falsche Beweisdatei unter und verlangt, dass der Lauf daran scheitert. Ohne
    # diesen Schritt ist ein gruenes Gate nicht von einem leeren zu unterscheiden — und genau
    # dieser Unterschied ist der teuerste Fehler in diesem Projekt.
    - VERUS="$VERUS_HOME/verus" bash tools/verus-verify.sh --selftest
    # Alle Dateien mit verus!-Block + der Modell-Treue-Waechter (verus-verify.sh ruft ihn auf).
    - VERUS="$VERUS_HOME/verus" bash tools/verus-verify.sh

# ---------------------------------------------------------------------------------------------
# Tier 1 — Kani. Laeuft ALLE vier Ziele (loader, region, sync, unsafe-safety), nicht nur den
# Loader-Parser; die alte Jobbeschriftung behauptete das Gegenteil und erzeugte daraus einen
# Todo-Eintrag ueber eine Luecke, die es nicht gab.
# ---------------------------------------------------------------------------------------------
kani:
  stage: gate
  cache:
    key: "kani-v0.67.0"
    paths: [.kani/, .cargo/, .rustup/]
  script:
    - apt-get update -qq && apt-get install -y -qq curl python3 >/dev/null
    - command -v cargo-kani >/dev/null || cargo install --locked kani-verifier
    - cargo kani setup
    # Host-Tests + Inert-Check: cfg(kani)/cfg(loom) duerfen den Normal-Build nicht brechen.
    - |
      set -euo pipefail
      SA="$CI_PROJECT_DIR/.tmp/loader_host"
      rm -rf "$SA"; mkdir -p "$SA/src"
      cp crates/sel4lake-loader/src/*.rs "$SA/src/"
      printf '[package]\nname="sel4lake-loader"\nversion="0.0.0"\nedition="2021"\n[workspace]\n[lib]\npath="src/lib.rs"\n' > "$SA/Cargo.toml"
      ( cd "$SA" && cargo test )
      SB="$CI_PROJECT_DIR/.tmp/sync_host"
      rm -rf "$SB"; mkdir -p "$SB/src"
      cp crates/sel4lake-sync/src/*.rs "$SB/src/"
      printf '[package]\nname="sel4lake-sync"\nversion="0.0.0"\nedition="2021"\n[workspace]\n[lib]\npath="src/lib.rs"\n[lints.rust]\nunexpected_cfgs = { level = "warn", check-cfg = [%s, %s] }\n' "'cfg(kani)'" "'cfg(loom)'" > "$SB/Cargo.toml"
      ( cd "$SB" && cargo build )
    - bash tools/kani-verify.sh
    # Kani baut fuers Host-Ziel; dort greift in sel4lake-sync der cfg-Zweig mit
    # IRQ_MASKING_IMPLEMENTED = false. Ein gruenes Kani sagt ueber die IRQ-Eigenschaft NICHTS —
    # die traegt allein der Waechter zur Uebersetzungszeit, und der wird hier in BEIDE Richtungen
    # geprueft (unveraendert muss uebersetzen, mit zerstoertem cfg muss der Bau abbrechen).
    - rustup toolchain install nightly --profile minimal --component rust-src
    - bash tools/guard-verify.sh x86_64-unknown-none
    - bash tools/guard-verify.sh aarch64-unknown-none-softfloat

# ---------------------------------------------------------------------------------------------
# Loom — alle Interleavings der Sync-Primitive. Seit B-7.2 gegen den ECHTEN
# sel4lake-sync-Quelltext; die frueheren Kopien sind geloescht.
# ---------------------------------------------------------------------------------------------
loom:
  stage: gate
  cache:
    key: "loom-v0.7"
    paths: [.cargo/, .rustup/]
  script:
    - bash tools/loom-verify.sh

# ---------------------------------------------------------------------------------------------
# Die billigen Gates. Sie brauchen weder Beweiser noch Netz und laufen in Sekunden — es gibt
# keinen Grund, sie nicht bei jedem Push zu fahren.
# ---------------------------------------------------------------------------------------------
host-tests:
  stage: gate
  cache:
    key: "host-tests"
    paths: [.cargo/, .rustup/]
  script:
    - bash tools/host-tests.sh

kerngrenze:
  stage: gate
  script:
    # Ohne Flag prueft das Skript UND fuehrt seinen Selbsttest (untergeschobenes Modul muss
    # erkannt werden). `--nur-pruefen` waere die Fassung ohne Selbsttest — hier absichtlich nicht.
    - bash tools/kernel-grenze.sh
