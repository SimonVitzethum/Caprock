# !!! DIESE DATEI LAEUFT NIRGENDS (Stand 2026-08-03). !!!
# Der Server unter git.simonsmp.jocraft.cc:8443 ist GitLab und liest .gitea/workflows/ nicht.
# Gemessen ueber die Pipelines-API: zwei Pipelines in der ganzen Projektgeschichte, beide vom
# 2026-05-23, beide mit GitLabs Auto-DevOps-Vorlage. Das Gate hier ist seit seiner Anlage am
# 2026-06-27 KEIN EINZIGES MAL gelaufen -- und genau deshalb fiel nicht auf, dass cap_space.rs
# 37 Tage lang rot war (9 verified, 1 errors).
# Der laufende Stand steht in `.gitlab-ci.yml`. Diese Datei bleibt nur, falls das Projekt spaeter
# auf Gitea umzieht; sie ist eine VORLAGE, keine Zusicherung. Zwei CI-Definitionen, von denen eine
# nicht laeuft, sind derselbe Riss wie zwei Suiten, die dasselbe Geraet verschieden aufsetzen --
# wer hier etwas aendert, aendert es auch drueben, oder loescht diese Datei.
#
# Caprock — Formale Verifikation (Tier 2, Verus) als CI-Gate.
#
# Ziel wie beim Kani-Gate: jeder Push/PR fuehrt die Verus-Beweise (dokumentierte Kernel-Invarianten:
# cap_audit_cdt, domain_audit, vspace_audit, dma_audit, loader_audit, trust_audit) erneut aus.
# Schlaegt ein Beweis fehl, schlaegt die CI fehl -> bewiesene Invarianten koennen nicht
# unbeabsichtigt verloren gehen.
#
# Verus wird aus dem gepinnten Binary-Release (+ Z3) installiert; die von Verus geforderte
# rustc-Toolchain via rustup. Gitea Actions (GitHub-kompatibel).

name: verus-verification
on: [push, pull_request]

# **Der Pin nennt den Beweiser, aus dem die Zahlen stammen.** Bis 2026-08-03 stand hier
# 0.2026.06.20.911e4e7, waehrend lokal 0.2026.07.27.31579f0 lief — zwei verschiedene Beweiser fuer
# dieselbe Aussage, und keine Stelle, an der das aufgefallen waere. Beide Fassungen sind mit dem
# heutigen Stand nachgemessen (je 18 verified, 0 errors fuer cap_space.rs); der Pin steht auf der,
# gegen die entwickelt wird.
env:
  VERUS_RELEASE: "0.2026.07.27.31579f0"
  VERUS_TOOLCHAIN: "1.97.1"

jobs:
  verus:
    name: Verus — Tier-2-Beweise (dokumentierte Audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust (rustup) installieren
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
              --default-toolchain stable --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Von Verus geforderte rustc-Toolchain
        run: rustup toolchain install "$VERUS_TOOLCHAIN" --profile minimal

      - name: Verus (+ Z3) cachen
        uses: actions/cache@v4
        with:
          path: ~/.verus
          key: verus-${{ env.VERUS_RELEASE }}

      - name: Verus installieren (idempotent)
        run: |
          if [ ! -x "$HOME/.verus/verus" ]; then
            url="https://github.com/verus-lang/verus/releases/download/release/${VERUS_RELEASE}/verus-${VERUS_RELEASE}-x86-linux.zip"
            curl -fsSL "$url" -o /tmp/verus.zip
            rm -rf /tmp/vx && unzip -q /tmp/verus.zip -d /tmp/vx
            mkdir -p "$HOME/.verus" && cp -r /tmp/vx/*/. "$HOME/.verus/"
          fi
          "$HOME/.verus/verus" --version

      # **Erst nachweisen, dass dieses Gate fehlschlagen KANN.** Der Selbsttest schiebt eine
      # nachweislich falsche Beweisdatei unter — an einer Stelle, die die frueheren zwei Globs
      # nicht getroffen haetten — und verlangt, dass der Lauf daran scheitert. Ohne diesen Schritt
      # ist ein gruenes Gate nicht von einem leeren zu unterscheiden.
      - name: Gate-Selbsttest (kann es ueberhaupt fehlschlagen?)
        run: VERUS="$HOME/.verus/verus" bash tools/verus-verify.sh --selftest

      - name: Verus-Beweise ausführen (alle Dateien mit verus!-Block) + Modell-Treue
        run: VERUS="$HOME/.verus/verus" bash tools/verus-verify.sh
