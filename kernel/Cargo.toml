# The Caprock kernel image.
#
# Phase 0: bootable skeleton. By design the kernel image will only ever contain
# the microkernel, capability system, scheduler, IPC and the Microkit runtime —
# drivers and services live in userland (see docs/adr/0006-hot-reload-architecture.md).

[package]
name = "caprock-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "caprock-kernel"
path = "src/main.rs"

[features]
# Optionale In-Kernel-Fuzzer (Entwicklungs-/Verifikationswerkzeuge, ADR 0013). NICHT in `default`:
# der Release-Build enthaelt keinerlei Fuzzer-Code. Mit `--features kernel-fuzz` werden die vier
# Fuzzer (fuzz/ipcfuzz/hwfuzz/loaderfuzz) aus `threads/fuzz.rs` einkompiliert. Die Audits bleiben
# IMMER im Kernel (feature-unabhaengig).
# `selftest` — die gesamte Pruefinfrastruktur (Selbsttests, Demo-/Testthreads, DMA-/DMAR-Tests,
# Farbtest, `system::testsupport`). Rund ein Viertel des Kernels ist Testcode, und er wurde bis
# hierher bei JEDEM Start mitkompiliert und ausgefuehrt.
#
# **NICHT in `default`** (A-2.2, gedreht 2026-07-29). Bis A-2.1 stand, waere das Gating kein
# schlankerer Kernel gewesen, sondern ein leerer: ohne Testcode blieb `configure() -> idle`, der
# Kernel hatte keinen Nicht-Test-Zweck. Jetzt hat er einen. `loader::start_root_task_reported()`
# liegt in `kernel_main` AUSSERHALB jedes Features: der Vorgabebau laedt das Startprogramm aus dem
# signierten Manifest und uebergibt ihm die Wurzel-Caps -- der seL4-Weg (todo F2). Ab hier ist jede
# weitere Faehigkeit ein Userland-Programm statt eines Kernel-Patches.
#
# Was der Vorgabebau NICHT mehr tut: Selbsttests, Demo-/Testthreads, DMA-/DMAR-Tests, Farbtest,
# `system::testsupport`. Rund ein Viertel des Kernels war Testcode und wurde bis hierher bei JEDEM
# Start mitkompiliert und ausgefuehrt.
#
# Bauen MIT Pruefinfrastruktur: `--features selftest`. Beide Suiten fordern das jetzt ausdruecklich
# fuer den gebooteten Bau (nicht ueber `default`) -- sonst waeren sie beim Dreh still geworden statt
# rot, und Stille sieht wie Erfolg aus.
# **Beide Konfigurationen gehoeren in die Testskripte.** Eine Konfiguration, die niemand baut,
# verrottet still -- diese Fehlerform hat hier schon viermal zugeschlagen (leere Event-Queue, nie
# ausgefuehrter x86-Testpfad, DMAR-Ausschlusspfad, und `--no-default-features` auf aarch64).
default = []
selftest = []
kernel-fuzz = []
# Continuous-Soak-Treiber (Burn-in #2): nach dem Selbsttest faehrt der Idle-Manager statt
# `system_off` eine Endlos-Epochenschleife (Dauerbetrieb EINER Instanz). NUR Harness/Testcode; der
# Kernel-Kern bleibt byte-identisch zum Release. Mit `soak,kernel-fuzz` kombinierbar.
soak = []

# Der Kernel-Kern + die aarch64-HAL: derzeit aarch64-spezifisch. Auf dem x86_64-Branch (Stufe 0:
# nur Boot+Serial) werden sie NICHT kompiliert; Stufe fuer Stufe werden die arch-agnostischen Crates
# ext-31: Alle Subsystem-Crates bauen jetzt fuer BEIDE Architekturen (die HAL waehlt ihre
# Implementierung per cfg(target_arch), s. caprock-hal). Die frueher aarch64-only Sektion
# entfaellt damit.
[dependencies]
caprock-hal = { path = "../crates/caprock-hal" }
caprock-sync = { path = "../crates/caprock-sync" }
caprock-slab = { path = "../crates/caprock-slab" }
caprock-mem = { path = "../crates/caprock-mem" }
caprock-region = { path = "../crates/caprock-region" }
caprock-loader = { path = "../crates/caprock-loader" }
caprock-trust = { path = "../crates/caprock-trust" }
caprock-cap = { path = "../crates/caprock-cap" }
caprock-sched = { path = "../crates/caprock-sched" }
caprock-ipc = { path = "../crates/caprock-ipc" }
caprock-abi = { path = "../crates/caprock-abi" }
caprock-microkit = { path = "../crates/caprock-microkit" }

# Device-Tree gibt es nur auf der ARM-Plattform (x86 nutzt Multiboot/ACPI).
[target.'cfg(target_arch = "aarch64")'.dependencies]
caprock-dtb = { path = "../crates/caprock-dtb" }
