# Binary-Loader-Parser (ext-26): reine, bounds-geprüfte Parser für das Boot-Archiv
# und (ab L1) Minimal-ELF64. KEIN `unsafe`, keine Kernel-/HW-Abhängigkeit — daher
# vollständig per Host-`cargo test` verifizier- und fuzzbar. Der privilegierte Teil
# (Segmente kopieren, mappen, spawnen) lebt im Kernel-Glue (kernel/src/loader.rs).
[package]
name = "caprock-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]

# `kani` ist ein externes cfg (Tier-1-Verifikation; nur unter `cargo kani` gesetzt, im Normalbuild
# inert). Als erwartetes cfg deklarieren -> kein `unexpected_cfgs`-Warning (Rust >= 1.80).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# **Eingeschlossenheit ist die Eintrittskarte** (Z28) -- gehalten von `tools/eingeschlossenheit.py`:
# `#![forbid(unsafe_code)]` im Wurzelmodul, kein Bauskript, und nur Abhaengigkeiten, die selbst
# eingeschlossen oder namentlich zugelassen sind. Die Marke steht IM MANIFEST und nicht in einer
# Liste im Waechter, damit Verschieben oder Umbenennen sie nicht vom Code trennen kann -- und weil
# `cargo metadata` sie woertlich herausgibt, koennen andere Werkzeuge dieselbe Zusage lesen.
[package.metadata.caprock]
einschluss = "streng"
