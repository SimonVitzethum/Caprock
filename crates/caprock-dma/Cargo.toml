# `caprock-dma` — der DMA-Pool einer Treiber-PD (Z22, P3).
#
# **Keine Abhaengigkeiten**, und das ist der Zweck: die Crate wird von einer Treiber-PD gelinkt,
# nicht vom Kern. Der Kernel mappt die Region EINMAL und vergibt das IOVA-Fenster; was danach
# passiert, ist Arithmetik innerhalb eines bereits gewaehrten Fensters und fuegt keine Autoritaet
# hinzu -- also gehoert es nicht in die TCB. Der heisse Pfad ist damit null Syscalls.
#
# `forbid(unsafe_code)` und reine Adressarithmetik -> auf dem HOST pruefbar, in Sekunden:
#   rustc --test --edition 2021 -O crates/caprock-dma/src/lib.rs -o /tmp/t && /tmp/t
[package]
name = "caprock-dma"
version.workspace = true
edition.workspace = true
# **GRENZ-CRATE: permissiv, und das ist tragend** (docs/grenze.md). Jede PD linkt das hier --
# stuende es unter AGPL, waere jedes Programm mit AGPL-Code gelinkt und die ABI-Ausnahme
# gegenstandslos. Dieselbe Grenze, fuer die Linux die UAPI-Header-Ausnahme hat.
license = "MIT OR Apache-2.0"

[dependencies]

# **Eingeschlossenheit ist die Eintrittskarte** (Z28) -- gehalten von `tools/eingeschlossenheit.py`:
# `#![forbid(unsafe_code)]` im Wurzelmodul, kein Bauskript, und nur Abhaengigkeiten, die selbst
# eingeschlossen oder namentlich zugelassen sind. Die Marke steht IM MANIFEST und nicht in einer
# Liste im Waechter, damit Verschieben oder Umbenennen sie nicht vom Code trennen kann -- und weil
# `cargo metadata` sie woertlich herausgibt, koennen andere Werkzeuge dieselbe Zusage lesen.
[package.metadata.caprock]
einschluss = "streng"
