# `aggressor-t` — adversarialer TrustedSAS-Testdienst (ext-27 T3, ADR 0012).
# Beweist "Trust != Privileg": ein als TrustedSAS geladener (EL0-isolierter) Dienst hat die HOECHSTE
# Cap-Autoritaet seiner Domaene, besitzt aber dennoch NUR die Operationsmacht der Caps, die er
# TATSAECHLICH haelt. Ohne PdControl/Loader/Tcb-Cap -> PDCTL/LOAD/KILL = BADCAP. Self-Judging.
[package]
name = "aggressor-t"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aggressor-t"
path = "src/main.rs"

[dependencies]
libcaprock = { path = "../../../../programs/libcaprock" }

# **Eingeschlossenheit ist die Eintrittskarte** (Z28) -- gehalten von `tools/eingeschlossenheit.py`:
# `#![forbid(unsafe_code)]` im Wurzelmodul, kein Bauskript, und nur Abhaengigkeiten, die selbst
# eingeschlossen oder namentlich zugelassen sind. Die Marke steht IM MANIFEST und nicht in einer
# Liste im Waechter, damit Verschieben oder Umbenennen sie nicht vom Code trennen kann -- und weil
# `cargo metadata` sie woertlich herausgibt, koennen andere Werkzeuge dieselbe Zusage lesen.
[package.metadata.caprock]
einschluss = "streng"
