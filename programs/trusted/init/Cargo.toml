# `init` — der Root-Task (A-2.1).
#
# Das erste Programm, das der Kernel aus der Startmenge laedt. Es bekommt die Wurzel-Caps, die das
# System-Manifest ihm zuweist, und laedt von dort aus den Rest -- ab hier ist jede weitere
# Faehigkeit ein Userland-Programm statt eines Kernel-Patches.
#
# TrustedSAS: es darf eine Loader-Cap halten, und deshalb laedt der Kernel es nur mit gueltigem
# Ed25519-Zertifikat (ADR 0014). Vollstaendig `#![forbid(unsafe_code)]`.
[package]
name = "init"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "init"
path = "src/main.rs"

[dependencies]
libcaprock = { path = "../../libcaprock" }

# **Eingeschlossenheit ist die Eintrittskarte** (Z28) -- gehalten von `tools/eingeschlossenheit.py`:
# `#![forbid(unsafe_code)]` im Wurzelmodul, kein Bauskript, und nur Abhaengigkeiten, die selbst
# eingeschlossen oder namentlich zugelassen sind. Die Marke steht IM MANIFEST und nicht in einer
# Liste im Waechter, damit Verschieben oder Umbenennen sie nicht vom Code trennen kann -- und weil
# `cargo metadata` sie woertlich herausgibt, koennen andere Werkzeuge dieselbe Zusage lesen.
[package.metadata.caprock]
einschluss = "streng"
