# `svc-demo` — signiertes TrustedSAS-Demoprogramm (ext-28, ADR 0014).
# Vollstaendig `#![forbid(unsafe_code)]`; einzige Abhaengigkeit ist das auditierte SDK libsel4lake
# (Syscall-ABI). Wird vom Build-/Signier-Tool (tools/sign_trusted.py) auditiert + signiert und nur
# mit gueltigem Zertifikat als TrustedSAS geladen.
[package]
name = "svc-demo"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "svc-demo"
path = "src/main.rs"

[dependencies]
libsel4lake = { path = "../../libsel4lake" }
