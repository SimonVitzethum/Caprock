# Build configuration for the SEL4Lake kernel.
#
# We cross-compile to a custom bare-metal aarch64 target and build `core`,
# `alloc` and `compiler_builtins` from source (no precompiled std exists for a
# freestanding target). Always invoke from the workspace root so the relative
# linker-script path below resolves.

[build]
target = "targets/aarch64-sel4lake.json"
target-dir = "build/target"

[unstable]
# Recent nightlies gate custom `.json` target specs behind this flag.
json-target-spec = true
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[target.aarch64-sel4lake]
rustflags = [
    # Use our linker script (sets load address + sections for QEMU `virt`).
    "-C", "link-arg=-Tkernel/linker.ld",
]

# x86_64-Port (Branch arch/x86_64): eingebauter Bare-Metal-Target x86_64-unknown-none
# (soft-float, kein SSE, static). Eigenes Linker-Skript (Multiboot1 @ 1 MiB). Per
# `--target x86_64-unknown-none` gewaehlt (s. build-x86.sh / test-qemu-x86.sh).
[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tkernel/x86_64-link.ld",
    "-C", "relocation-model=static",
]
# NOTE on FP/NEON: we keep them enabled (the aarch64 ABI ties `fp-armv8` to
# `neon`; disabling them is being phased out by rustc). The kernel itself avoids
# floating point, and FP/SIMD register state will be saved on context switch
# only when a thread uses it (lazy FP) — handled in the context-switch phase.
# `strict-align` is set in the target spec (targets/aarch64-sel4lake.json):
# with the MMU off, all accesses are Device-typed and must be aligned.
