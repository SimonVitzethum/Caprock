[package]
name = "lx-shim-demo"
version = "0.0.0"
edition = "2021"
description = "Linux NIC driver excerpt mapped onto Caprock schemes (standalone demo, not a workspace member)"
license = "MIT OR Apache-2.0"

# Standalone: this empty section detaches the crate from the Caprock workspace
# (root and programs/ manifests must NOT list it as a member). It stays
# verifiable on its own via an isolated `cargo test` in a /tmp copy, the same
# way tools/host-tests.sh tests dependency-carrying crates.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
caprock-dma = { path = "../../crates/caprock-dma" }
caprock-wait = { path = "../../crates/caprock-wait" }
caprock-region = { path = "../../crates/caprock-region" }
