# `virtio-blk` — der erste Treiber als geladenes Userland-Programm (A-5.1).
#
# Zwei Abhaengigkeiten, und beide sind der Punkt:
#
#   * `libcaprock`  — das Minimal-SDK (Syscalls, Panik-Handler), wie jedes andere Programm.
#   * `caprock-virtio` — die Treiberlogik. Sie liegt im KERNEL-Workspace unter `crates/`, haengt
#     aber an **nichts** (kein caprock-hal, kein Kernel, keine Architektur). Genau dafuer wurde
#     sie am 2026-08-01 dorthin entkoppelt: damit ein Userland-Programm sie linken kann, ohne den
#     Kernel mitzuziehen. Dass dieser Pfad hier funktioniert, ist die Probe aufs Exempel -- waere
#     auch nur eine Kernel-Abhaengigkeit uebriggeblieben, liesse sich dieses Programm nicht bauen.
[package]
name = "virtio-blk"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "virtio-blk"
path = "src/main.rs"

[dependencies]
libcaprock = { path = "../../libcaprock" }
caprock-virtio = { path = "../../../crates/caprock-virtio" }
# A-6.2: der GPT-Parser. Ebenfalls abhaengigkeitsfrei und `forbid(unsafe_code)` -- er liest fremde
# Bytes von der Platte, und die gehoeren nicht in den Kern.
caprock-part = { path = "../../../crates/caprock-part" }
# Z22 P3: der DMA-Pool. Ebenfalls abhaengigkeitsfrei und `forbid(unsafe_code)`. Er ist das TOR vor
# `caprock_virtio::Region`: dessen `from_raw` ist ungeprueft, und eine Region mit `dev == cpu`
# (Identitaet) oder `dev == 0` liefe scheinbar, bis das Geraet ins Leere schriebe.
caprock-dma = { path = "../../../crates/caprock-dma" }
